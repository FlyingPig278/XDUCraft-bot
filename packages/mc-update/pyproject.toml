[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-xducraft-mc-update"
version = "0.1.0"
description = "Push Minecraft release and snapshot updates to subscribed OneBot v11 groups."
readme = "README.md"
requires-python = ">=3.9,<4"
dependencies = [
    "nonebot2~=2.4.3",
    "nonebot-adapter-onebot~=2.4.6",
    "nonebot-plugin-apscheduler~=0.5.0",
    "nonebot-plugin-xducraft-core[onebot]>=0.3.0,<0.4.0",
    "pydantic>=2,<3",
    "httpx~=0.28.1",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["xducraft_mc_update"]
include-package-data = false

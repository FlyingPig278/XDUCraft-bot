name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install released Core
        run: python -m pip install 'nonebot-plugin-xducraft-core[onebot] @ git+https://github.com/FlyingPig278/nonebot-plugin-xducraft-core.git@v0.3.0'
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Check installed dependencies
        run: python -m pip check

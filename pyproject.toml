[project]
name = "XDUCraft-bot"
version = "0.1.0"
description = "XDUCraft-bot"
readme = "README.md"
requires-python = ">=3.9, <4.0"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = [
    "xducraft_config",
    "xducraft_happy_bot",
    "xducraft_auto_friend",
    "xducraft_keyword",
    "xducraft_pig_bot",
    "xducraft_mc_update",
    "xducraft_invite",
    "xducraft_anti_recall",
    "xducraft_wordcloud",
    "xducraft_mc_status",
    "xducraft_features",
    "xducraft_admin",
]
plugin_dirs = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"